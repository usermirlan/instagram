version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mikosocial_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mikosocial}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mikosocial_secure_pwd_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mikosocial}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Caching & Channel Layer)
  redis:
    image: redis:7-alpine
    container_name: mikosocial_redis
    restart: always
    volumes:
      - redis_data:/data

  # 3. Django Backend (Daphne ASGI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mikosocial_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-super-secret-key-change-this}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,nginx,${DOMAIN:-mikosocial.com}
      - DB_ENGINE=postgresql
      - DB_NAME=${DB_NAME:-mikosocial}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-mikosocial_secure_pwd_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,https://${DOMAIN:-mikosocial.com}
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    expose:
      - "8000"

  # 4. React Frontend (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mikosocial_frontend
    restart: always
    expose:
      - "80"

  # 5. Reverse Proxy Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: mikosocial_nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_volume:/app/media:ro
      - static_volume:/app/staticfiles:ro

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:
